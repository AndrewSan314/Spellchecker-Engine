# Review E2: the repo shipped no Python dependency declaration at all, yet
# tools/ imports numpy, torch and pyarrow — `python -m unittest discover -s test`
# failed with 6 import errors on a clean machine.
#
# Nothing under src/ needs Python: the serving engine is pure Node.js. These
# dependencies exist only for the offline training / export / audit tools.
#
#   uv sync                      # create .venv and install
#   uv run python -m unittest discover -s test -t . -v
#   uv run python tools/build_lm.py --help
[project]
name = "spellchecker-engine-tools"
version = "0.1.0"
description = "Offline training / export / audit tooling for the Vietnamese SMS Content Validation Engine (the serving engine itself is Node.js and needs none of this)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    # CPU wheels are enough: tools/train_attention_reranker.py and
    # tools/pretrain_attention_encoder.py train a ~300 KB int8 model.
    "torch>=2.2",
]

[project.optional-dependencies]
dev = []

# The tools are plain scripts under tools/ (run with `uv run python tools/x.py`),
# not an installable package — no build backend is configured on purpose.
[tool.uv]
package = false
